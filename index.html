<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TNPSC Study Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400..700&family=Noto+Sans+Tamil:wght@400..700&display=swap">
<style>
/* Layout: sticky header with section tabs (bottom bar on phones). OMR-sheet motif: filled bubbles for answers, status and the logo. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E9EDF6; --ink:#131A2E; --muted:#586278; --line:#D6DCE8;
  --accent:#2438D4; --on-accent:#FFFFFF; --accent-soft:#E4E8FC;
  --ok:#17794D; --ok-soft:#DDF2E7; --warn:#9A5B0A; --warn-soft:#FBEFD9; --bad:#B83225; --bad-soft:#FBE3E0;
  --font-display:"Bricolage Grotesque","Noto Sans Tamil",system-ui,sans-serif;
  --font-body:"Manrope","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1222; --surface:#151B30; --surface-2:#1E2644; --ink:#E9EDFA; --muted:#9AA4BF; --line:#2B3555;
    --accent:#8B9BFF; --on-accent:#0D1222; --accent-soft:#222C57;
    --ok:#4CC38A; --ok-soft:#173528; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#FF8A7D; --bad-soft:#40201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#151B30; --surface-2:#1E2644; --ink:#E9EDFA; --muted:#9AA4BF; --line:#2B3555;
  --accent:#8B9BFF; --on-accent:#0D1222; --accent-soft:#222C57;
  --ok:#4CC38A; --ok-soft:#173528; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#FF8A7D; --bad-soft:#40201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0}
body{
  font-family:var(--font-body);font-size:15px;line-height:1.55;background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 112px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body.in-test{padding-block:0 40px}
p{margin:0}
h1{font:700 28px/1.15 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:700 18px/1.25 var(--font-display);margin:0 0 10px;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.head{display:grid;gap:6px;margin-bottom:18px}
.stack{display:grid;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
main{padding-block:18px 8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:10px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:44px}
.brand{display:inline-flex;align-items:center;gap:10px;font:700 17px var(--font-display);color:var(--ink);text-decoration:none}
.omr{display:inline-flex;gap:3px}
.omr i{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:50%}
.omr i.on{background:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.chip.pick{cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip b{font-family:var(--font-mono);font-weight:500;opacity:.8}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px}
.tab svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
body.in-test .tabs{display:none}
@media (min-width:820px){
  body{padding-block:0 56px}
  .tabs{position:static;display:flex;gap:6px;border:0;background:transparent;padding:0;margin-top:8px}
  .tab{flex-direction:row;gap:8px;padding:8px 16px;font-size:14px;border-radius:999px}
  .tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0 2px;min-height:30px;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:38px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.check{display:flex;gap:10px;align-items:center;font-size:14px}

/* progress */
.ring{width:132px;height:132px;flex:none}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.ring-n{font:700 28px var(--font-display);fill:var(--ink)}
.ring-s{font:500 9px var(--font-mono);fill:var(--muted);letter-spacing:.08em}
.cov{gap:20px;flex-wrap:nowrap}
.kv{display:grid;gap:4px;min-width:0}
.kv b{font:700 20px var(--font-display)}
.bar{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar .s3{opacity:1}.bar .s2{opacity:.62}.bar .s1{opacity:.32}
.big{font:700 40px/1 var(--font-display);letter-spacing:-.02em}
.subrow{display:grid;gap:6px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit}
.subrow:first-of-type{border-top:0}
.subrow.static{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:-1px}
.legend .l2 i{opacity:.62}.legend .l1 i{opacity:.32}
.chart{width:100%;height:auto;display:block}
.q{white-space:pre-line}
.qc{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.qc:first-child{border-top:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qc .opt{padding:8px 12px}
.jsonbox{font-family:var(--font-mono);font-size:12px}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}
.edit-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font:500 10px var(--font-mono);fill:var(--muted)}
.chart .bar{fill:var(--accent);opacity:.4}
.chart .bar.on{opacity:1}
.chart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.on{fill:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-of-type{border-top:0}
.li .ti{font-weight:600}
.li .su{color:var(--muted);font-size:13px}

/* syllabus */
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;background:conic-gradient(var(--dc,var(--accent)) calc(var(--p,0)*1%),transparent 0)}
.dot.s1{--p:34;border-color:var(--accent)}
.dot.s2{--p:67;border-color:var(--accent)}
.dot.s3{--p:100;--dc:var(--ok);border-color:var(--ok)}
.stat{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .tn{font-weight:600}
.topic .tt{color:var(--muted);font-size:13px}
.topic .tools{grid-column:1/-1;display:flex;gap:16px}

/* timer */
.clock-wrap{position:relative;width:min(260px,72vw);margin:0 auto}
.tring-bg{fill:none;stroke:var(--surface-2);stroke-width:10}
.tring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.clock{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
#tm-clock{font:500 44px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* tests */
.run{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.run{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.q{font:600 18px/1.55 var(--font-body);margin:10px 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;cursor:pointer}
div.opt{cursor:default}
.opt .otxt{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:500 12px var(--font-mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.qa{margin-top:16px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin-top:10px}
.pal{aspect-ratio:1;max-width:100%;border:1.5px solid var(--muted);border-radius:50%;background:transparent;font:500 13px var(--font-mono);cursor:pointer}
.pal.ans{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pal.mk{box-shadow:0 0 0 2px var(--warn)}
.pal.cur{outline:2px solid var(--accent);outline-offset:2px}
.confirm{margin-top:14px;padding:12px;border-radius:10px;background:var(--warn-soft);display:grid;gap:10px}
.rev{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.rev:first-child{border-top:0}
.rev .q{font-size:16px;margin:2px 0 4px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.tag.right{background:var(--ok-soft);color:var(--ok)}
.tag.wrong{background:var(--bad-soft);color:var(--bad)}
.tag.skip{background:var(--surface-2);color:var(--muted)}
.exp{font-size:14px;color:var(--muted)}
.exp b{color:var(--ink)}
.err{padding:12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* chat */
.chatlog{height:min(56vh,520px);min-height:260px;overflow-y:auto;display:grid;align-content:start;gap:12px;padding:2px}
.msg{max-width:94%;min-width:0}
.msg.me{justify-self:end}
.msg.me .bt{background:var(--accent);color:var(--on-accent);border-radius:14px 14px 4px 14px;padding:10px 14px;overflow-wrap:anywhere}
.msg.bot .md{background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:10px 14px;overflow-wrap:anywhere}
.md p+p,.md ul+p,.md p+ul{margin-top:8px}
.md ul{margin:0;padding-left:20px}
.md code{font-family:var(--font-mono);font-size:.9em}
.errnote{font-size:13px;color:var(--bad);margin-top:6px}
.composer{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;align-items:end;margin-top:12px}
.empty{display:grid;gap:10px;justify-items:start}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.pulse,.spin{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header id="top" class="top"></header>
<main id="view" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtClock(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):pad(m))+':'+pad(s);}
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?h+'h '+pad(m)+'m':m+'m';}
function daysToExam(){if(!P.examDate)return null;const t=new Date(P.examDate+'T00:00:00');if(isNaN(t))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000);}
function greet(){const h=new Date().getHours();return 'வணக்கம் · '+(h<12?'Good morning':h<17?'Good afternoon':'Good evening');}
let toastT=0;
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- syllabus ---------- */
const SUBJECTS=[
{id:'tam',en:'General Tamil',ta:'பொதுத் தமிழ்',t:[
 ['tam1','Grammar: letters & words','இலக்கணம்: எழுத்து, சொல்'],
 ['tam2','Grammar: meaning, prosody & figures of speech','பொருள், யாப்பு, அணி'],
 ['tam3','Spelling & correct usage','பிழை திருத்தம்'],
 ['tam4','Synonyms, antonyms & idioms','ஒருபொருள், எதிர்ச்சொல், மரபுத்தொடர்'],
 ['tam5','Sangam literature','சங்க இலக்கியம்'],
 ['tam6','Thirukkural & Pathinenkilkanakku','திருக்குறள், பதினெண்கீழ்க்கணக்கு'],
 ['tam7','Epics & Bhakti literature','காப்பியங்கள், பக்தி இலக்கியம்'],
 ['tam8','Modern literature & poets','நவீன இலக்கியம்'],
 ['tam9','Tamil scholars & their works','தமிழறிஞர்களும் நூல்களும்']]},
{id:'sci',en:'General Science',ta:'அறிவியல்',t:[
 ['sci1','Physics basics','இயற்பியல்'],
 ['sci2','Chemistry basics','வேதியியல்'],
 ['sci3','Botany','தாவரவியல்'],
 ['sci4','Zoology','விலங்கியல்'],
 ['sci5','Human body, nutrition & health','மனித உடல், ஊட்டச்சத்து, நலம்'],
 ['sci6','Science & technology developments','அறிவியல் தொழில்நுட்ப வளர்ச்சி']]},
{id:'geo',en:'Geography',ta:'புவியியல்',t:[
 ['geo1','Earth, universe & oceans','புவி, அண்டம், கடல்'],
 ['geo2','India: rivers, mountains & landforms','இந்தியா: ஆறுகள், மலைகள்'],
 ['geo3','Climate, soils & natural resources','காலநிலை, மண், வளங்கள்'],
 ['geo4','Tamil Nadu geography','தமிழ்நாடு புவியியல்'],
 ['geo5','Agriculture, industry & transport','வேளாண்மை, தொழில், போக்குவரத்து'],
 ['geo6','Environment & disaster management','சுற்றுச்சூழல், பேரிடர் மேலாண்மை']]},
{id:'his',en:'History of India',ta:'இந்திய வரலாறு',t:[
 ['his1','Ancient India','பண்டைய இந்தியா'],
 ['his2','Medieval India','இடைக்கால இந்தியா'],
 ['his3','British rule & revolts','ஆங்கிலேயர் ஆட்சி, கிளர்ச்சிகள்'],
 ['his4','Indian National Movement','இந்திய தேசிய இயக்கம்'],
 ['his5','Indian culture, art & heritage','இந்தியப் பண்பாடு, கலை']]},
{id:'tnh',en:'Tamil Nadu History & Culture',ta:'தமிழ்நாடு வரலாறு, பண்பாடு',t:[
 ['tnh1','Tamil Nadu: ancient to Nayak period','சங்ககாலம் முதல் நாயக்கர் வரை'],

/* ---------- state & storage ---------- */
const LSK='tnpsc-study-desk-v1'; // the same key every earlier version used, so existing progress is kept
const DATA_VERSION=2;
let P={topics:{},examDate:'',goal:120,lang:'tanglish'},LOG={},TESTS=[],QB=[],QS={},SEEDED=false;
const store={db:null,base:'',mode:'local',dirty:new Set(),timer:0,busy:false,chunks:0,fail:0,lsErr:false};
let SAMPLE=null,CLAUDE=null,sampleReady=false;
const clone=x=>JSON.parse(JSON.stringify(x));
function lsSave(){
  try{localStorage.setItem(LSK,JSON.stringify({v:DATA_VERSION,seeded:SEEDED,P:P,LOG:LOG,TESTS:TESTS,QB:QB,QS:QS}));store.lsErr=false;}
  catch(e){if(!store.lsErr)toast('This device is out of storage space. Export your question bank, then delete old questions.');store.lsErr=true;}
}
function lsLoad(){
  let raw=null,j=null;
  try{raw=localStorage.getItem(LSK);j=raw?JSON.parse(raw):null;}
  catch(e){j=null;if(raw){try{localStorage.setItem(LSK+'-corrupt',raw);}catch(_){}}}
  if(j){
    // version 1 data (no "v" field) is copied once to a backup key before it is upgraded
    if(!j.v){try{if(!localStorage.getItem(LSK+'-backup-v1'))localStorage.setItem(LSK+'-backup-v1',raw);}catch(e){}}
    if(j.P)P=Object.assign(P,j.P);
    if(!P.topics)P.topics={};
    if(j.LOG)LOG=j.LOG;
    if(Array.isArray(j.TESTS))TESTS=j.TESTS;
    if(Array.isArray(j.QB))QB=j.QB.map(normQ).filter(Boolean);
    if(j.QS&&typeof j.QS==='object')QS=j.QS;
    SEEDED=!!j.seeded;
  }
  if(!SEEDED){seedBank();SEEDED=true;lsSave();}
}
function seedBank(){
  const have=new Set(QB.map(q=>qKey(q.q)));
  BANK.forEach((b,i)=>{
    const q=normQ({id:'S'+String(i+1).padStart(3,'0'),t:b[0],q:b[1],o:b[2],a:b[3],e:b[4],d:'Medium',ty:'Practice',vs:'AI Generated',src:'Starter set written by Claude. Not checked against a textbook.'});
    if(q&&!have.has(qKey(q.q)))QB.push(q);
  });
}
function pruneLog(){const k=Object.keys(LOG).sort();while(k.length>120)delete LOG[k.shift()];}
function payload(k){return k==='state'?{topics:P.topics,examDate:P.examDate||'',goal:P.goal,lang:P.lang}:k==='log'?{days:LOG}:k==='qstats'?{s:QS}:{list:TESTS};}
function syncText(){
  if(store.mode==='cloud')return (store.dirty.size||store.busy)?'Saving to your Claude account…':'Everything is saved to your Claude account.';
  if(store.mode==='error')return 'Could not reach cloud storage. Your changes are kept on this device and will be retried.';
  return 'Progress is saved on this device.';
}
function syncBadge(){document.querySelectorAll('.sync').forEach(el=>{el.textContent=syncText();});}
function save(k){
  store.dirty.add(k);
  if(k==='log')pruneLog();
  lsSave();
  if(store.db){clearTimeout(store.timer);store.timer=setTimeout(flush,800);}
  syncBadge();
}
async function writeBank(){
  const enc=new TextEncoder(),chunks=[];let cur=[],bytes=0;
  QB.forEach(q=>{
    const n=enc.encode(JSON.stringify(q)).length;
    if(cur.length&&bytes+n>180000){chunks.push(cur);cur=[];bytes=0;}
    cur.push(q);bytes+=n;
  });
  if(cur.length||!chunks.length)chunks.push(cur);
  const col=store.db.collection(store.base);
  for(let i=0;i<chunks.length;i++)await col.doc('qbank-'+i).set(clone({list:chunks[i]}));
  await col.doc('qbank-meta').set({n:chunks.length,count:QB.length,ts:Date.now()});
  for(let i=chunks.length;i<store.chunks;i++){try{await col.doc('qbank-'+i).delete();}catch(e){}}
  store.chunks=chunks.length;
}
async function flush(){
  if(store.busy||!store.db)return;
  store.busy=true;
  while(store.dirty.size){
    const k=store.dirty.values().next().value;
    store.dirty.delete(k);
    try{
      if(k==='qbank')await writeBank();
      else await store.db.collection(store.base).doc(k).set(clone(payload(k)));
      store.mode='cloud';store.fail=0;
    }catch(e){
      store.mode='error';store.fail++;store.dirty.add(k);break; // keep the change queued and retry later
    }
  }
  store.busy=false;
  if(store.mode==='error'&&store.fail<6){clearTimeout(store.timer);store.timer=setTimeout(flush,Math.min(60000,3000*Math.pow(2,store.fail)));}
  syncBadge();
}
async function bootCloud(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=r[0],user=r[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const col=db.collection('data/users/'+id);
    const s=await Promise.all(['state','log','tests','qstats','qbank-meta'].map(k=>col.doc(k).get()));
    store.db=db;store.base='data/users/'+id;store.mode='cloud';
    if(s[0].exists){P=Object.assign({topics:{},examDate:'',goal:120,lang:'tanglish'},clone(s[0].data()));if(!P.topics)P.topics={};}else store.dirty.add('state');
    if(s[1].exists){LOG=clone(s[1].data()).days||{};}else store.dirty.add('log');
    if(s[2].exists){TESTS=clone(s[2].data()).list||[];}else store.dirty.add('tests');
    if(s[3].exists){
      const cs=clone(s[3].data()).s||{};let extra=false;
      Object.keys(QS).forEach(k=>{if(!cs[k]){cs[k]=QS[k];extra=true;}});
      QS=cs;if(extra)store.dirty.add('qstats');
    }else store.dirty.add('qstats');
    if(s[4].exists){
      // cloud questions win for the same id; questions that exist only on this device are kept and uploaded
      const n=+(s[4].data().n)||0;store.chunks=n;
      const parts=await Promise.all(Array.from({length:n},(_,i)=>col.doc('qbank-'+i).get()));
      let cloud=[];
      parts.forEach(p=>{if(p.exists)cloud=cloud.concat(clone(p.data()).list||[]);});
      cloud=cloud.map(normQ).filter(Boolean);
      const ids=new Set(cloud.map(q=>q.id));let extra=false;
      QB.forEach(q=>{if(!ids.has(q.id)){cloud.push(q);extra=true;}});
      QB=cloud;if(extra)store.dirty.add('qbank');
    }else store.dirty.add('qbank');
    lsSave();
    if(store.dirty.size)flush();
    softRender();
  }catch(e){store.mode='error';syncBadge();}
}

/* ---------- question bank: structure, validation, helpers ---------- */
// A question: id, sid (subject), t (topic), q/o/e (text, options, explanation) in language l ("en" or "ta"),
// optional x = {q,o,e} translation in the other language, a (correct index 0-3), d (difficulty),
// ty (type), src, exam, yr, added, rev (last reviewed), vs (status), pvs (status before it was reported).
// Older questions that only have t, q, o, a, e keep working: every other field gets a default.
const QD=['Easy','Medium','Hard'];
const QT=['PYQ','Textbook','Practice','Current Affairs'];
const QV=['Draft','AI Generated','AI Checked','Human Verified','Published','Reported'];
const hasTa=s=>/[஀-௿]/.test(String(s||''));
const qKey=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{M}\p{N}]+/gu,'');
const tstr=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
let idSeq=0;
function genId(){return 'Q'+Date.now().toString(36)+(idSeq++).toString(36)+Math.random().toString(36).slice(2,5);}
function normAlt(x){
  if(!x||typeof x!=='object')return null;
  const o=Array.isArray(x.o)?x.o.map(tstr):[],q=tstr(x.q);
  if(!q&&!o.some(Boolean))return null;
  return {q:q,o:o,e:tstr(x.e)};
}
function normQ(raw){
  if(!raw||typeof raw!=='object')return null;
  let q=tstr(raw.q),o=Array.isArray(raw.o)?raw.o.map(tstr):[],e=tstr(raw.e),x=normAlt(raw.x),l=(raw.l==='ta'||raw.l==='en')?raw.l:'';
  if(!q&&(raw.qe||raw.qt)){ // bilingual shape: qt/ot/et = Tamil, qe/oe/ee = English
    const en={q:tstr(raw.qe),o:Array.isArray(raw.oe)?raw.oe.map(tstr):[],e:tstr(raw.ee)};
    const ta={q:tstr(raw.qt),o:Array.isArray(raw.ot)?raw.ot.map(tstr):[],e:tstr(raw.et)};
    const prim=en.q?en:ta,alt=en.q?ta:en;
    q=prim.q;o=prim.o;e=prim.e;l=en.q?'en':'ta';
    x=alt.q?normAlt(alt):null;
  }
  if(!l)l=hasTa(q)?'ta':'en';
  const t=tstr(raw.t);
  const a=typeof raw.a==='number'?raw.a:((raw.a!=null&&raw.a!=='')?Number(raw.a):NaN);
  return {
    id:tstr(raw.id)||genId(),sid:TOPIC[t]?TOPIC[t].sub:tstr(raw.sid),t:t,q:q,o:o,a:a,e:e,l:l,x:x,
    d:QD.indexOf(raw.d)>=0?raw.d:'Medium',ty:QT.indexOf(raw.ty)>=0?raw.ty:'Practice',
    src:tstr(raw.src),exam:tstr(raw.exam),yr:tstr(raw.yr),added:tstr(raw.added)||dkey(),rev:tstr(raw.rev),

function qKeyMap(pool){const m=new Map();pool.forEach(q=>{const k=qKey(q.q);if(k&&!m.has(k))m.set(k,q.id);});return m;}
// safe arithmetic (no eval): used to check answers of questions that are a plain calculation such as "15 + 5 × 4 = ?"
function arith(expr){
  const t=String(expr).replace(/−/g,'-').replace(/×|x/gi,'*').replace(/÷/g,'/').replace(/\s+/g,'');
  if(!/^[\d.+\-*\/()]+$/.test(t))return null;
  const tok=t.match(/\d+(?:\.\d+)?|[-+*\/()]/g);
  if(!tok||tok.join('')!==t)return null;
  const out=[],ops=[],pr={'+':1,'-':1,'*':2,'/':2};
  const apply=()=>{const op=ops.pop(),b=out.pop(),a=out.pop();if(a===undefined||b===undefined)throw 0;out.push(op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b);};
  let prev=null;
  try{
    for(let i=0;i<tok.length;i++){
      const k=tok[i];
      if(/^\d/.test(k)){out.push(parseFloat(k));prev='n';}
      else if(k==='('){ops.push(k);prev='(';}
      else if(k===')'){while(ops.length&&ops[ops.length-1]!=='(')apply();if(!ops.length)throw 0;ops.pop();prev=')';}
      else{
        if(prev===null||prev==='('){if(k==='-')out.push(0);else throw 0;}
        else if(prev==='o')throw 0;
        while(ops.length&&ops[ops.length-1]!=='('&&pr[ops[ops.length-1]]>=pr[k])apply();
        ops.push(k);prev='o';
      }
    }
    while(ops.length){if(ops[ops.length-1]==='(')throw 0;apply();}
    return(out.length===1&&isFinite(out[0]))?out[0]:null;
  }catch(e){return null;}
}
function mathCheck(q){
  const m=String(q.q).replace(/^\s*(simplify|find|evaluate|calculate)\s*[:\-]?\s*/i,'').match(/^([\d\s.+\-−×÷*\/()xX]+?)\s*=\s*\?*\s*$/);
  if(!m)return null;
  const v=arith(m[1]);if(v===null)return null;
  const nums=q.o.map(s=>{const n=parseFloat(String(s).replace(/[,₹%\s]/g,''));return isNaN(n)?null:n;});
  if(nums.some(n=>n===null))return null;
  return {ok:Math.abs(nums[q.a]-v)<1e-6,val:v};
}
function validateQ(q,km){
  const err=[],warn=[];
  if(!q.q||q.q.length<5)err.push('The question is empty or too short.');
  if(!Array.isArray(q.o)||q.o.length!==4||q.o.some(s=>!s))err.push('Exactly four non-empty options are required.');
  else if(new Set(q.o.map(qKey)).size<4)err.push('Two options are the same.');
  if(!Number.isInteger(q.a)||q.a<0||q.a>3)err.push('Choose exactly one correct option (A to D).');
  if(!TOPIC[q.t])err.push('Choose a valid topic.');
  else if(q.sid&&q.sid!==TOPIC[q.t].sub)err.push('The subject does not match the topic.');
  if(q.x&&(!q.x.q||!Array.isArray(q.x.o)||q.x.o.length!==4||q.x.o.some(s=>!s)))err.push('The translation needs a question and four options. Complete it or remove it.');
  if(!q.e)warn.push('No explanation. Add one so students can learn from mistakes.');
  if(q.ty==='PYQ'&&!(q.exam&&q.yr&&q.src))err.push('A Previous Year Question needs the exam name, the year and the source. Use Practice if you cannot name them.');
  if(q.ty==='Textbook'&&!q.src)warn.push('Name the textbook or source.');
  if((q.vs==='Human Verified'||q.vs==='Published')&&!q.src)warn.push('Verified questions should name the source used for checking.');
  const k=qKey(q.q);
  if(k){const map=km||qKeyMap(QB),other=map.get(k);if(other&&other!==q.id)err.push('Duplicate of question '+other+'.');}
  if(!err.length){const mc=mathCheck(q);if(mc&&!mc.ok)err.push('The marked answer does not match the calculated value ('+mc.val+').');}
  return {err:err,warn:warn};
}

function md(s){

  if(!ids.length){toast('Pick at least one subject.');return;}
  const n=TS.n;TS.err='';
  if(TS.src==='bank'||!aiReady()){
    const qs=bankQs(ids,n);
    if(!qs.length){TS.err='Your question bank has no usable questions for this selection. Add questions in Bank, or use AI questions.';render();return;}
    if(qs.length<n)toast('Only '+qs.length+' questions in your bank match this selection.');
    beginTest(qs,'bank');return;
  }
  if(!SAMPLE){toast('Still connecting to Claude. Try again in a moment.');return;}
  TS.busy=true;TS.prog='Preparing your questions…';TS.ctl=new AbortController();render();
  const ctl=TS.ctl;
  try{
    const batches=makeBatches(planTopics(ids,n),10);let done=0;
    const parts=[];
    for(const b of batches){parts.push(await genBatch(b,TS.lang,ctl.signal));done++;TS.prog='Prepared '+done+' of '+batches.length+' set'+(batches.length>1?'s':'')+'…';const p=$('#ts-prog');if(p)p.textContent=TS.prog;}
    let qs=[].concat.apply([],parts);
    if(qs.length<Math.max(3,Math.ceil(n*0.6)))throw {code:'short'};
    qs=shuffle(qs).slice(0,n);
    TS.busy=false;beginTest(qs,'ai');
  }catch(e){
    try{ctl.abort();}catch(_){}
    TS.busy=false;
    if(!(e&&e.code==='cancelled'))TS.err=(e&&e.code==='short')?'Claude returned too few usable questions. Try again, or ask for fewer questions.':aiErr(e);
    render();
  }
}
function beginTest(qs,src){
  const dur=TS.mins*60000;
  T={qs:qs,i:0,start:Date.now(),end:Date.now()+dur,durMs:dur,src:src,confirm:false,done:false,rf:'all',res:null};
  TS.topics=null;
  clearInterval(ttInt);ttInt=setInterval(ttTick,500);
  render();window.scrollTo(0,0);
}
function ttTick(){
  if(!T||T.done){clearInterval(ttInt);return;}
  const r=(T.end-Date.now())/1000;
  const el=$('#tt-clock');if(el)el.textContent=fmtClock(r);
  if(r<=0)finishTest(true);
}
function finishTest(auto){
  if(!T||T.done)return;
  T.done=true;clearInterval(ttInt);recordAttempts(T.qs);
  const used=Math.min(T.durMs,Date.now()-T.start)/1000;
  let c=0,w=0,sk=0;const subj={},top={};
  T.qs.forEach(q=>{
    const sid=TOPIC[q.t].sub;
    subj[sid]=subj[sid]||[0,0];top[q.t]=top[q.t]||[0,0];
    subj[sid][1]++;top[q.t][1]++;
    if(q.sel<0)sk++;else if(q.sel===q.a){c++;subj[sid][0]++;top[q.t][0]++;}else w++;
  });
  T.res={c:c,w:w,sk:sk,n:T.qs.length,sec:Math.round(used),auto:!!auto,subj:subj};
  TESTS.unshift({t:Date.now(),n:T.qs.length,c:c,w:w,sk:sk,sec:T.res.sec,src:T.src,subj:subj,top:top});
  if(TESTS.length>40)TESTS.length=40;
  save('tests');
  if(T.res.sec>=30)logStudy(T.res.sec,'','');
  render();window.scrollTo(0,0);
}

/* ---------- AI providers: the browser calls the provider directly with the student's own key ---------- */
const PROV={
  gemini:{name:'Google Gemini',model:'gemini-4-hydrogen',hint:'Free key from aistudio.google.com/apikey'},
  groq:{name:'Groq',model:'llama-3.3-70b-versatile',hint:'Free key from console.groq.com/keys'},
  openrouter:{name:'OpenRouter',model:'openrouter/free',hint:'Key from openrouter.ai/keys. Models whose name ends in :free cost nothing'},
  openai:{name:'OpenAI (ChatGPT)',model:'gpt-4o-mini',hint:'Paid key from platform.openai.com/api-keys'}
};
const AIK='tnpsc-ai-v1';
const AI={provider:'gemini',keys:{},models:{},vlang:'ta-IN',speak:false,chosen:false,pref:''};
function aiLoad(){try{const j=JSON.parse(localStorage.getItem(AIK)||'null');if(j){if(PROV[j.provider])AI.provider=j.provider;AI.keys=j.keys||{};AI.models=j.models||{};if(j.vlang)AI.vlang=j.vlang;AI.chosen=!!j.chosen;AI.pref=j.provider||'';AI.speak=!!j.speak;}}catch(e){}}
function aiSave(){try{localStorage.setItem(AIK,JSON.stringify(AI));}catch(e){}}
const aiKey=()=>(AI.keys[AI.provider]||'').trim();
const aiReady=()=>(AI.provider==='claude'&&!!CLAUDE)||!!aiKey();
const GEM_FALLBACK=['gemini-4-hydrogen','gemini-3.8-flash','gemini-2.5-flash-lite'];
const aiModel=()=>((AI.models[AI.provider]||'').trim().replace(/^models\//,'').replace(/\s+/g,'-'))||PROV[AI.provider].model;

function parseLoose(t){
  try{return JSON.parse(t);}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json',message:'The reply was not valid JSON.',text:t};
}
async function aiCall(input,opts){
  const key=aiKey();
  if(!key)throw {code:'no_key',message:'No API key'};
  const p=AI.provider,model=aiModel(),signal=opts&&opts.signal;
  const turns=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:m.content}));
  const headers={'Content-Type':'application/json'};
  let url,body;
  if(p==='gemini'){
    const contents=[];
    turns.forEach(m=>{
      const r=m.role==='assistant'?'model':'user',last=contents[contents.length-1];
      if(last&&last.role===r)last.parts[0].text+='\n\n'+m.content;else contents.push({role:r,parts:[{text:m.content}]});
    });
    url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
    headers['x-goog-api-key']=key;
    body={contents:contents,generationConfig:{temperature:0.3,maxOutputTokens:8192}};
  }else{
    url={groq:'https://api.groq.com/openai/v1/chat/completions',openrouter:'https://openrouter.ai/api/v1/chat/completions',openai:'https://api.openai.com/v1/chat/completions'}[p];
    headers.Authorization='Bearer '+key;
    body={model:model,messages:turns};
    if(p==='openai')body.max_completion_tokens=4096;else{body.max_tokens=4096;body.temperature=0.3;}
  }
  const tries=p==='gemini'?[model].concat(GEM_FALLBACK.filter(x=>x!==model)):[model];
  let res,j=null;
  for(let ti=0;ti<tries.length;ti++){
    if(p==='gemini')url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(tries[ti])+':generateContent';
    try{res=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:signal});}
    catch(e){
      if((signal&&signal.aborted)||(e&&e.name==='AbortError'))throw {code:'cancelled',message:'Cancelled'};
      throw {code:'network',message:'Network error'};
    }
    j=null;
    try{j=await res.json();}catch(e){}
    if(res.ok)break;
    const m0=String((j&&j.error&&(j.error.message||j.error))||'');
    if(!(p==='gemini'&&ti<tries.length-1&&/no longer available|not found|not supported|unexpected model|deprecated/i.test(m0)))break;
  }
  if(!res.ok){
    const em=j&&j.error;
    const msg=String(em&&(em.message||em)||'');
    const code=(res.status===401||res.status===403||(res.status===400&&/api key/i.test(msg)))?'not_granted':res.status===429?'rate_limited':'upstream_error';
    throw {code:code,message:'HTTP '+res.status+(msg?': '+msg:'')};
  }
  let text='',trunc=false;
  if(p==='gemini'){
    const c=j&&j.candidates&&j.candidates[0];
    text=c&&c.content&&c.content.parts?c.content.parts.map(x=>x.text||'').join(''):'';
    trunc=!!(c&&c.finishReason==='MAX_TOKENS');
  }else{
    const c=j&&j.choices&&j.choices[0];
    text=c&&c.message?(c.message.content||''):'';
    trunc=!!(c&&c.finish_reason==='length');
  }
  if(!text.trim())throw {code:'upstream_error',message:'The model returned an empty reply.'};
  return {text:text,truncated:trunc};
}
function makeProvider(){
  const f=async function(input,opts){
    if(AI.provider==='claude'&&CLAUDE)return CLAUDE(input,opts);
    const r=await aiCall(input,opts);
    if(opts&&opts.onText){try{opts.onText({text:r.text,delta:r.text});}catch(e){}}
    return {text:r.text,truncated:r.truncated};
  };
  f.json=async function(input,opts){if(AI.provider==='claude'&&CLAUDE)return CLAUDE.json(input,opts);const r=await aiCall(input,opts);return parseLoose(r.text);};
  return f;
}

/* ---------- study material and retrieval (the AI only sees the parts that match the question) ---------- */
const MK='tnpsc-material-v1';
const MAT={text:'',use:true,strict:true,chunks:[],df:{}};
const DR={mat:null,vv:null,vvans:''};
const toks=s=>(String(s).toLowerCase().match(/[\p{L}\p{M}\p{N}]+/gu)||[]).filter(w=>w.length>1).map(w=>w.length>6?w.slice(0,6):w);
function matIndex(){
  MAT.chunks=[];MAT.df={};
  const paras=MAT.text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  let cur='';
  const push=()=>{if(cur.trim())MAT.chunks.push({t:cur.trim(),tf:{}});cur='';};
  paras.forEach(p=>{
    if(p.length>1400){push();for(let i=0;i<p.length;i+=1100)MAT.chunks.push({t:p.slice(i,i+1300).trim(),tf:{}});}
    else if(cur.length+p.length>1100){push();cur=p;}
    else cur+=(cur?'\n\n':'')+p;
  });
  push();
  MAT.chunks.forEach(c=>{
    toks(c.t).forEach(w=>{c.tf[w]=(c.tf[w]||0)+1;});
    Object.keys(c.tf).forEach(w=>{MAT.df[w]=(MAT.df[w]||0)+1;});
  });
}
function matLoad(){
  try{const j=JSON.parse(localStorage.getItem(MK)||'null');if(j){MAT.text=j.text||'';MAT.use=j.use!==false;MAT.strict=j.strict!==false;}}catch(e){}
  matIndex();
}
function matStore(){
  try{localStorage.setItem(MK,JSON.stringify({text:MAT.text,use:MAT.use,strict:MAT.strict}));return true;}
  catch(e){toast('This material is too large to save on this device. Remove some text.');return false;}
}
function matSearch(q,k){
  const qs=Array.from(new Set(toks(q))),N=MAT.chunks.length;
  const sc=MAT.chunks.map((c,i)=>{let s=0;qs.forEach(w=>{const f=c.tf[w];if(f)s+=(1+Math.log(f))*Math.log(1+N/(MAT.df[w]||1));});return [s,i];});
  return sc.filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,k).sort((a,b)=>a[1]-b[1]).map(x=>MAT.chunks[x[1]].t);
}
function matExcerpt(max){
  const idx=shuffle(MAT.chunks.map((c,i)=>i));const out=[];let n=0;
  for(let a=0;a<idx.length;a++){const t=MAT.chunks[idx[a]].t;if(out.length&&n+t.length>max)break;out.push(t);n+=t.length;}
  return out.join('\n---\n');
}
function groundFor(q){return(MAT.use&&MAT.chunks.length)?matSearch(q,5).join('\n---\n'):'';}
function groundBlock(q){
  if(!MAT.use||!MAT.chunks.length)return '';
  const ex=groundFor(q+' '+(CH.topic&&TOPIC[CH.topic]?TOPIC[CH.topic].en:''));
  const head=MAT.strict
    ?'\n\nSTRICT MODE. The student gave you their own study material. Answer ONLY from the excerpts below. Finish every answer with a line starting "Source:" that quotes a short phrase (under 15 words) copied exactly from the excerpt you used. If the excerpts do not contain the answer, say clearly that it is not in the provided material and suggest what to check in the textbook. Never use outside knowledge and never guess.'
    :'\n\nThe student gave you their own study material. Prefer the excerpts below. If you add anything that is not in them, label it "Outside the material:" so the student can verify it.';
  return head+'\n\nMATERIAL EXCERPTS:\n'+(ex||'(no matching excerpt found for this question)');
}
function langDesc(){
  return {tanglish:'Tanglish: Tamil written in English letters, mixing in common English exam terms, in the warm tone of a Tamil Nadu tuition teacher',english:'simple English',tamil:'Tamil script, with key exam terms also given in English in brackets'}[P.lang]||'simple English';
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const VO={rec:null};
function micPaint(){document.querySelectorAll('.mic').forEach(b=>{b.textContent=VO.rec?'Stop':'Speak';});}
function micToggle(id){
  if(!SR){toast('Voice input is not supported in this browser. Try Chrome or Edge.');return;}
  if(VO.rec){try{VO.rec.stop();}catch(e){}return;}
  const el=document.getElementById(id);if(!el)return;
  try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
  const r=new SR();r.lang=AI.vlang;r.interimResults=true;r.continuous=false;
  const base=el.value?el.value+' ':'';
  r.onresult=ev=>{let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;el.value=base+t;el.dispatchEvent(new Event('input',{bubbles:true}));};
  r.onerror=ev=>{toast(ev.error==='not-allowed'?'Allow microphone access for this site.':ev.error==='no-speech'?'Did not hear anything. Try again.':'Voice input stopped ('+ev.error+').');};
  r.onend=()=>{VO.rec=null;micPaint();};
  VO.rec=r;
  try{r.start();}catch(e){VO.rec=null;}
  micPaint();
}
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const clean=String(text).replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();
    if(!clean)return;
    const u=new SpeechSynthesisUtterance(clean.slice(0,1500));u.lang=AI.vlang;
    const vs=speechSynthesis.getVoices(),pre=AI.vlang.slice(0,2);
    const v=vs.find(x=>x.lang===AI.vlang)||vs.find(x=>x.lang.toLowerCase().indexOf(pre)===0);
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function chatRules(q){

function setComposer(){const s=$('#ch-send'),p=$('#ch-stop');if(s)s.hidden=CH.busy;if(p)p.hidden=!CH.busy;}
async function chatSend(text){
  text=(text||'').trim();if(!text)return;
  if(!SAMPLE){toast(sampleReady?'Claude is not available in this view.':'Still connecting to Claude…');return;}
  if(CH.busy){toast('Wait for the current answer, or press Stop.');return;}
  CH.msgs.push({role:'user',content:text});
  const bot={role:'assistant',content:'',pending:true};CH.msgs.push(bot);
  const turns=CH.msgs.filter(m=>m!==bot&&!m.err).slice(-10).map(m=>({role:m.role,content:m.content}));
  CH.busy=true;CH.ctl=new AbortController();paintChat(true);setComposer();
  try{
    const r=await SAMPLE([{role:'user',content:chatRules(text)}].concat(turns),{cache:false,signal:CH.ctl.signal,modelTier:'default',onText:u=>{bot.content=u.text;bot.pending=false;paintChat();}});
    bot.content=r.text;if(r.truncated)bot.content+='\n\n(The answer was cut short. Ask for a shorter answer or the next part.)';
    if(AI.speak)speak(r.text);
  }catch(e){
    if(e&&e.text){bot.content=e.text;}
    if(e&&e.code==='cancelled'){if(!bot.content)CH.msgs.splice(CH.msgs.indexOf(bot),1);}
    else{bot.err=true;bot.note=aiErr(e);if(e&&e.code==='refused')bot.content='';}
  }
  bot.pending=false;CH.busy=false;CH.ctl=null;paintChat(true);setComposer();
}

function filterQB(){
  const s=BKF.q.trim().toLowerCase();
  return QB.filter(q=>{
    const st=QS[q.id]||{};
    if(BKF.sub&&q.sid!==BKF.sub)return false;
    if(BKF.topic&&q.t!==BKF.topic)return false;
    if(BKF.d&&q.d!==BKF.d)return false;
    if(BKF.ty&&q.ty!==BKF.ty)return false;
    if(BKF.vs&&q.vs!==BKF.vs)return false;
    if(BKF.lang==='ta'&&!(q.l==='ta'||(q.x&&hasTa(q.x.q))))return false;
    if(BKF.lang==='en'&&!(q.l==='en'||(q.x&&!hasTa(q.x.q))))return false;
    if(BKF.bk&&!st.bk)return false;
    if(BKF.att){
      const n=st.n||0,w=n-(st.c||0);
      if(BKF.att==='new'&&n>0)return false;
      if(BKF.att==='seen'&&n===0)return false;
      if(BKF.att==='wrong'&&w<1)return false;
    }
    if(s){
      const hay=(q.id+' '+q.q+' '+q.o.join(' ')+' '+q.e+' '+(q.x?q.x.q+' '+q.x.o.join(' '):'')+' '+q.src+' '+q.exam).toLowerCase();

  });

function impCheck(){
  const ta=$('#imp-ta');if(ta)IMP.text=ta.value;
  IMP.err='';IMP.res=null;
  let j;
  try{j=JSON.parse(IMP.text);}catch(e){IMP.err='This is not valid JSON. Check commas, quotes and brackets.';return;}
  const arr=Array.isArray(j)?j:(j&&Array.isArray(j.questions)?j.questions:null);
  if(!arr){IMP.err='Expected a list of questions, or an object with a "questions" list.';return;}
  const km=qKeyMap(QB),ids=new Set(QB.map(q=>q.id)),res={ok:[],dup:0,bad:[]};
  arr.forEach((raw,i)=>{
    const q=normQ(raw);
    if(!q){res.bad.push({i:i+1,why:'Not a question object.'});return;}
    if(ids.has(q.id)){const ex=QB.find(z=>z.id===q.id);if(ex&&qKey(ex.q)===qKey(q.q)){res.dup++;return;}q.id=genId();}
    const v=validateQ(q,km);
    if(v.err.length){if(/^Duplicate/.test(v.err[0]))res.dup++;else res.bad.push({i:i+1,why:v.err[0]});return;}
    res.ok.push(q);ids.add(q.id);km.set(qKey(q.q),q.id);
  });

  let h='';
  if(off)h+='<div class="err" style="margin-bottom:14px">Claude is not available in this view. Open this page inside Claude to use the doubt helper.</div>';
  h+='<section class="card"><div class="form"><label class="field"><span>Topic you are studying</span><select data-in="chTopic">'+topics+'</select></label>'+
    '<label class="field"><span>Reply language</span><select data-in="chLang"><option value="tanglish"'+(P.lang==='tanglish'?' selected':'')+'>Tanglish</option><option value="english"'+(P.lang==='english'?' selected':'')+'>English</option><option value="tamil"'+(P.lang==='tamil'?' selected':'')+'>தமிழ்</option></select></label></div>'+
    '<div class="chips" style="margin:14px 0"><button class="chip pick" data-act="chQuick" data-k="explain">Explain simply</button><button class="chip pick" data-act="chQuick" data-k="points">Key exam points</button><button class="chip pick" data-act="chQuick" data-k="mnemonic">Memory tricks</button><button class="chip pick" data-act="chQuick" data-k="quiz">Quiz me</button></div>'+
    '<div id="chatlog" class="chatlog" aria-live="polite"></div>'+
    '<div class="composer"><textarea id="ch-in" rows="2" placeholder="Type your doubt…"'+(off?' disabled':'')+'></textarea><div class="row" style="justify-content:flex-end"><button class="btn mic" data-act="mic" data-t="ch-in">'+(VO.rec?'Stop':'Speak')+'</button><button class="btn primary" id="ch-send" data-act="chSend"'+(off?' disabled':'')+'>Send</button><button class="btn" id="ch-stop" data-act="chStop" hidden>Stop</button></div></div>'+
    '<p class="note">AI can make mistakes. Turn on "Answer only from my material" in Setup for answers checked against your own notes.</p></section>';
  return h;
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('in-test',view==='tests'&&!!T&&!T.done);
  $('#top').innerHTML=headerHTML();
  const fn={home:homeHTML,syllabus:sylHTML,timer:timerHTML,tests:testsHTML,ask:askHTML,bank:bankHTML}[view]||homeHTML;
  $('#view').innerHTML=fn();
  if(view==='ask'){paintChat(true);setComposer();}
}
function softRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a))return;
  if(TS.busy)return;
  render();
}
function go(v){view=v;render();window.scrollTo(0,0);if(location.hash.slice(1)!==v)location.hash=v;}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==view){view=h;render();window.scrollTo(0,0);}});

/* ---------- events ---------- */
const H={
  goPlan(){go('home');setTimeout(()=>{const p=$('#plan');if(p)p.scrollIntoView({block:'center'});const i=$('#in-exam');if(i)i.focus();},60);},
  goTimer(){go('timer');},
  mic(el){micToggle(el.dataset.t);},
  tsVs(el){TS.vs=el.dataset.v;render();},
  qBm(el){toggleBm(el.dataset.id);render();},
  qRep(el){toggleReport(el.dataset.id);toast('Marked as reported. It will not appear in tests until you clear the report in Bank.');render();},
  qbTopic(el){const t=TOPIC[el.dataset.id];BKF.sub=t.sub;BKF.topic=t.id;BKF.page=0;BKE=null;go('bank');},
  bkAdd(){BKE=bkNew();render();window.scrollTo(0,0);},
  bkEdit(el){const q=QB.find(z=>z.id===el.dataset.id);if(!q)return;BKE=bkFrom(q);render();window.scrollTo(0,0);},
  bkOpen(el){const id=el.dataset.id;if(BKX.has(id))BKX.delete(id);else BKX.add(id);render();},
  bkBm(el){toggleBm(el.dataset.id);render();},
  bkRep(el){toggleReport(el.dataset.id);render();},
  bkDel(el){BKD=el.dataset.id;render();},
  bkDelNo(){BKD='';render();},
  bkDelYes(){const id=BKD;BKD='';if(id){qbDel(id);toast('Question deleted.');}render();},
  bkPage(el){BKF.page+=+el.dataset.v;render();window.scrollTo(0,0);},
  bkClear(){Object.assign(BKF,{q:'',sub:'',topic:'',d:'',ty:'',vs:'',lang:'',bk:false,att:'',page:0});render();},
  bkSearch(){const el=$('#bk-q');BKF.q=el?el.value:BKF.q;BKF.page=0;render();},
  bkImp(){IMP={text:'',res:null,err:''};EXP='';render();},
  impCheck(){impCheck();render();},
  impClose(){IMP=null;render();},
  impCommit(){
    if(!IMP||!IMP.res)return;
    const n=IMP.res.ok.length;
    IMP.res.ok.forEach(q=>QB.push(q));
    if(n){save('qbank');toast(n+' question'+(n===1?'':'s')+' added.');}
    IMP=null;render();
  },
  bkExport(){EXP=bkExportText();IMP=null;render();},
  expClose(){EXP='';render();},
  expDownload(){saveFile('tnpsc-question-bank-'+dkey()+'.json',EXP);},
  expCopy(){
    const ta=$('#exp-ta');
    try{navigator.clipboard.writeText(EXP).then(()=>toast('Copied.')).catch(()=>{if(ta){ta.focus();ta.select();}toast('Select the text and copy it with Ctrl+C.');});}
    catch(e){if(ta){ta.focus();ta.select();}toast('Select the text and copy it with Ctrl+C.');}
  },
  qeAddX(){qeRead();BKE.d.x={q:'',o:['','','',''],e:''};render();},
  qeRemX(){qeRead();BKE.d.x=null;render();},
  qeCancel(){BKE=null;render();window.scrollTo(0,0);},
  qeSave(){
    qeRead();const d=BKE.d;
    const rec=normQ({id:BKE.id,t:d.t,sid:d.sid,q:d.q,o:d.o,a:d.a,e:d.e,l:d.l,x:d.x,d:d.d,ty:d.ty,src:d.src,exam:d.exam,yr:d.yr,vs:d.vs,added:BKE.added,rev:dkey(),pvs:BKE.pvs});
    const v=validateQ(rec,null);
    BKE.errs=v.err;BKE.warns=v.warn;
    if(v.err.length){render();window.scrollTo(0,0);return;}
    qbPut(rec);BKE=null;toast('Question saved.');render();window.scrollTo(0,0);
  },
  askTab(el){askTab=el.dataset.v;render();},
  async aiTest(){
    const k=$('#ai-key'),m=$('#ai-model');
    if(k)AI.keys[AI.provider]=k.value.trim();
    if(m)AI.models[AI.provider]=m.value.trim();
    aiSave();toast('Testing the connection…');
    try{const r=await SAMPLE('Reply with the single word OK.',{cache:false});toast('Connected. The AI replied: '+r.text.trim().slice(0,40));}
    catch(e){toast(aiErr(e)||'The test failed.');}
  },
  matSave(){
    const ta=$('#mat-ta');let t=ta?ta.value:MAT.text;
    if(t.length>400000){t=t.slice(0,400000);toast('Only the first 400,000 characters were kept.');}
    MAT.text=t;DR.mat=null;matIndex();
    if(matStore()&&t.length<=400000)toast('Saved '+MAT.chunks.length+' parts of material.');
    render();
  },
  matClear(){MAT.text='';DR.mat=null;matIndex();matStore();render();},
  vvStart(){
    const ta=$('#vv-qs');const raw=ta?ta.value:(DR.vv||'');
    DR.vv=raw;try{localStorage.setItem(VK,raw);}catch(e){}
    const qs=vvParse(raw);
    if(!qs.length){toast('Write at least one question.');return;}
    if(!aiReady()){toast('Add your API key in Setup first.');return;}
    VV.qs=qs;VV.i=0;VV.cur=null;VV.all=[];VV.done=false;render();vvShowQ();
  },
  vvSend(){
    const ta=$('#vv-in');const text=ta?ta.value.trim():'';
    if(VV.busy)return;
    if(!text){toast('Type or speak your answer first.');return;}
    DR.vvans='';try{if(VO.rec)VO.rec.stop();}catch(e){}
    VV.cur={ans:text,fb:'',err:''};render();vvEval();
  },
  vvRetry(){if(!VV.cur||VV.busy)return;VV.cur.err='';VV.cur.fb='';render();vvEval();},
  vvSkip(){if(VV.busy)return;vvPush(true);vvAdvance();},
  vvNext(){if(VV.busy)return;vvPush(false);vvAdvance();},
  vvReset(){
    try{if(VV.ctl)VV.ctl.abort();}catch(e){}
    try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
    VV.i=-1;VV.cur=null;VV.all=[];VV.done=false;VV.busy=false;render();
  },
  vvSpeak(){const q=VV.qs[VV.i];if(q)speak(q.q);},
  goHome(){T=null;go('home');},
  cycle(el){const id=el.dataset.id;P.topics[id]=((P.topics[id]|0)+1)%4;save('state');render();},
  sylSub(el){sylSub=el.dataset.id;render();},
  sylFilt(el){sylFilter=el.dataset.v;render();},
  openSub(el){sylSub=el.dataset.id;sylFilter='all';go('syllabus');},
  nuStudy(el){if(!(TM.running||tmElapsed()>0)){TM.subj=TOPIC[el.dataset.id].sub;TM.topic=el.dataset.id;}go('timer');},
  topicAsk(el){CH.topic=el.dataset.id;askTab='chat';go('ask');chatSend(quickText('explain'));},
  topicTest(el){TS.topics=[el.dataset.id];TS.n=10;TS.mins=10;TS.minsEdited=true;T=null;go('tests');startTest();},
  tmStart(){tmStart();},tmPause(){tmPause();},tmFinish(){tmFinish(false);},tmReset(){tmReset();},
  tmMode(el){TM.mode=el.dataset.m;render();},
  tmPreset(el){TM.mins=+el.dataset.min;TM.targetMs=TM.mins*60000;render();},
  tsSub(el){const id=el.dataset.id;if(TS.subjects.has(id))TS.subjects.delete(id);else TS.subjects.add(id);TS.topics=null;render();},
  tsQuick(el){const v=el.dataset.v;const all=SUBJECTS.map(s=>s.id);TS.subjects=new Set(v==='all'?all:v==='gs'?all.filter(x=>x!=='tam'&&x!=='apt'):[v]);TS.topics=null;render();},
  tsSrc(el){TS.src=el.dataset.v;render();},
  tsStart(){startTest();},
  tsCancel(){try{if(TS.ctl)TS.ctl.abort();}catch(e){}TS.busy=false;render();},
  tPick(el){T.qs[T.i].sel=+el.dataset.j;render();},
  tGo(el){T.i=+el.dataset.k;T.confirm=false;render();window.scrollTo(0,0);},
  tPrev(){if(T.i>0){T.i--;render();}},
  tNext(){if(T.i<T.qs.length-1){T.i++;render();}else{T.confirm=true;render();}},
  tMark(){const q=T.qs[T.i];q.mark=!q.mark;render();},
  tClear(){T.qs[T.i].sel=-1;render();},
  tSubmit(){T.confirm=true;render();},
  tKeep(){T.confirm=false;render();},
  tConfirm(){finishTest(false);},
  tRf(el){T.rf=el.dataset.v;render();},
  tNew(){T=null;TS.err='';render();window.scrollTo(0,0);},
  tExplain(el){
    const q=T.qs[+el.dataset.k];
    CH.topic=q.t;
    const msg='Explain this TNPSC question and why the correct answer is right.\nQuestion: '+q.q+'\nOptions: '+q.o.map((o,j)=>'ABCD'[j]+') '+o).join('  ')+'\nCorrect answer: '+'ABCD'[q.a]+'\nMy answer: '+(q.sel<0?'skipped':'ABCD'[q.sel]);
    askTab='chat';go('ask');chatSend(msg);
  },
  chSend(){const ta=$('#ch-in');if(!ta)return;const t=ta.value;if(!t.trim())return;ta.value='';chatSend(t);},
  chStop(){try{if(CH.ctl)CH.ctl.abort();}catch(e){}},
  chQuick(el){if(!CH.topic){toast('Pick a topic first.');return;}chatSend(quickText(el.dataset.k));},
  chExample(el){chatSend(el.dataset.q);}
};
const IN={
  exam(el){P.examDate=el.value;save('state');render();},
  aiProv(el){AI.provider=el.value;AI.chosen=true;aiSave();render();},
  bkQ(el){BKF.q=el.value;BKF.page=0;render();},
  bkSub(el){BKF.sub=el.value;BKF.topic='';BKF.page=0;render();},
  bkTopic(el){BKF.topic=el.value;BKF.page=0;render();},
  bkD(el){BKF.d=el.value;BKF.page=0;render();},
  bkTy(el){BKF.ty=el.value;BKF.page=0;render();},
  bkVs(el){BKF.vs=el.value;BKF.page=0;render();},
  bkLang(el){BKF.lang=el.value;BKF.page=0;render();},
  bkAtt(el){BKF.att=el.value;BKF.page=0;render();},
  bkBmOnly(el){BKF.bk=el.checked;BKF.page=0;render();},
  qeSid(){qeRead();BKE.d.t='';render();},
  qeLang(){qeRead();render();},
  impFile(el){
    const f=el.files&&el.files[0];if(!f||!IMP)return;
    if(f.size>5000000){IMP.err='That file is larger than 5 MB.';render();return;}
    f.text().then(t=>{IMP.text=t;IMP.res=null;IMP.err='';render();}).catch(()=>{IMP.err='Could not read that file.';render();});
  },
  aiKey(el){AI.keys[AI.provider]=el.value.trim();aiSave();},
  aiModel(el){AI.models[AI.provider]=el.value.trim();aiSave();},
  vLang(el){AI.vlang=el.value;aiSave();},
  vSpeak(el){AI.speak=el.checked;aiSave();if(!el.checked){try{speechSynthesis.cancel();}catch(e){}}},
  matUse(el){MAT.use=el.checked;matStore();render();},
  matStrict(el){MAT.strict=el.checked;matStore();},
  matFile(el){
    const f=el.files&&el.files[0];if(!f)return;
    if(f.size>2000000){toast('That file is too large. Use a text file under 2 MB.');return;}
    f.text().then(t=>{const ta=$('#mat-ta');const cur=ta?ta.value:(DR.mat||'');const nv=(cur?cur+'\n\n':'')+t;if(ta)ta.value=nv;DR.mat=nv;toast('File loaded. Press Save material.');}).catch(()=>toast('Could not read that file.'));
  },
  goal(el){P.goal=clamp(Math.round(+el.value)||0,0,720);save('state');render();},
  tmCustom(el){const m=clamp(Math.round(+el.value)||25,1,300);TM.mins=m;TM.targetMs=m*60000;render();},
  tmSubj(el){TM.subj=el.value;TM.topic='';render();},
  tmTopic(el){TM.topic=el.value;},
  tmMark(el){TM.mark=el.checked;},
  tsN(el){TS.n=+el.value;if(!TS.minsEdited)TS.mins=TS.n;render();},
  tsMins(el){TS.mins=clamp(Math.round(+el.value)||TS.n,1,300);TS.minsEdited=true;render();},
  tsLang(el){TS.lang=el.value;},
  chTopic(el){CH.topic=el.value;},
  chLang(el){P.lang=el.value;save('state');}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=H[el.dataset.act];if(!f)return;
  if(el.tagName==='A')e.preventDefault();
  f(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-in]');if(!el)return;
  const f=IN[el.dataset.in];if(f)f(el);
});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='ch-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();H.chSend();}
  if(e.target&&e.target.id==='bk-q'&&e.key==='Enter'){e.preventDefault();IN.bkQ(e.target);}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if(TM.running){wlOn();tmTick();}if(T&&!T.done)ttTick();}
  else if(store.db&&store.dirty.size){clearTimeout(store.timer);flush();}
});

/* ---------- boot ---------- */
lsLoad();aiLoad();matLoad();
{const h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0)view=h;}
render();
SAMPLE=makeProvider();sampleReady=true;
try{
  if(window.claude&&window.claude.use){
    window.claude.use('sample').then(sm=>{
      if(!sm)return;
      CLAUDE=sm;PROV.claude={name:'Claude (built in)',model:'',hint:'Uses your own Claude account'};
      if(!AI.chosen||AI.pref==='claude')AI.provider='claude';
      softRender();
    }).catch(()=>{});
  }
}catch(e){}
bootCloud();
})();
